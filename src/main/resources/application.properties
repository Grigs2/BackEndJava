spring.application.name=TioDaPerua

#http://localhost:8080/TioDaPerua/api
server.servlet.context-path=/${spring.application.name}/api/



#Conecao com o banco de dados
#spring.datasource.url=jdbc:postgresql://localhost:5432/TioDaPerua

# Usa o nome do servi�o do docker (db) se a vari�vel de ambiente existir,
# sen�o usa o localhost (seu PC)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/TioDaPerua}
spring.datasource.username=postgres
spring.datasource.password=sa
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


spring.jpa.properties.hibernate.transaction.jta.platform=org.hibernate.service.jta.platform.internal.JBossAppServerJtaPlatform
spring.jpa.properties.hibernate.jdbc.lab.non_contextual_creation=true
spring.jpa.properties.hibertane.format_sql=true

app.security.jwt.secret-base64=${JWT_SECRET_BASE64:}
app.security.jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:15}
app.security.jwt.refresh-token-days=${JWT_REFRESH_TOKEN_DAYS:30}
app.terms.version=${TERMS_VERSION:}
app.gps.consent.version=${GPS_CONSENT_VERSION:}
app.admin.bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:true}
app.admin.bootstrap.email=${ADMIN_EMAIL:}
app.email.sendgrid.api-key=${SENDGRID_API_KEY:}
app.email.from=${SENDGRID_FROM_EMAIL:}
app.email.password-reset-url=${PASSWORD_RESET_URL:}
app.admin.bootstrap.password=${ADMIN_PASSWORD:}
