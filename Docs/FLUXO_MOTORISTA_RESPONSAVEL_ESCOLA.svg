<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1400" viewBox="0 0 1200 1400" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="seta" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="1200" height="1400" fill="#ffffff"/>

  <text x="30" y="42" font-size="22" font-weight="bold" fill="#222">Fluxo Motorista – Responsável – Escola</text>

  <!-- Legenda -->
  <rect x="760" y="22" width="16" height="16" rx="3" fill="#cfe8ff" stroke="#6a9fd4"/>
  <text x="782" y="35" font-size="13" fill="#333">Escola</text>
  <rect x="840" y="22" width="16" height="16" rx="3" fill="#d4f5d4" stroke="#5aa85a"/>
  <text x="862" y="35" font-size="13" fill="#333">Motorista</text>
  <rect x="950" y="22" width="16" height="16" rx="3" fill="#ffe3c2" stroke="#d9913a"/>
  <text x="972" y="35" font-size="13" fill="#333">Responsável</text>
  <rect x="1070" y="22" width="16" height="16" rx="3" fill="#eeeeee" stroke="#888"/>
  <text x="1092" y="35" font-size="13" fill="#333">Sistema</text>

  <!-- Trilha principal: cadastros e aprovação da escola -->
  <rect x="440" y="70" width="320" height="56" rx="8" fill="#cfe8ff" stroke="#6a9fd4"/>
  <text x="600" y="93" font-size="15" text-anchor="middle" fill="#222">1. Escola se cadastra</text>
  <text x="600" y="113" font-size="13" text-anchor="middle" fill="#444">no app</text>
  <line x1="600" y1="126" x2="600" y2="160" stroke="#555" stroke-width="2" marker-end="url(#seta)"/>

  <rect x="440" y="160" width="320" height="56" rx="8" fill="#d4f5d4" stroke="#5aa85a"/>
  <text x="600" y="183" font-size="15" text-anchor="middle" fill="#222">2. Motorista se cadastra</text>
  <text x="600" y="203" font-size="13" text-anchor="middle" fill="#444">no app e envia documentos</text>
  <line x1="600" y1="216" x2="600" y2="250" stroke="#555" stroke-width="2" marker-end="url(#seta)"/>

  <rect x="400" y="250" width="400" height="56" rx="8" fill="#d4f5d4" stroke="#5aa85a"/>
  <text x="600" y="273" font-size="15" text-anchor="middle" fill="#222">3. Motorista escolhe escolas</text>
  <text x="600" y="293" font-size="13" text-anchor="middle" fill="#444">e envia solicitação de atendimento</text>
  <line x1="600" y1="306" x2="600" y2="330" stroke="#555" stroke-width="2" marker-end="url(#seta)"/>

  <rect x="440" y="330" width="320" height="56" rx="8" fill="#cfe8ff" stroke="#6a9fd4"/>
  <text x="600" y="353" font-size="15" text-anchor="middle" fill="#222">4. Escola avalia documentos</text>
  <text x="600" y="373" font-size="13" text-anchor="middle" fill="#444">do motorista</text>
  <line x1="600" y1="386" x2="600" y2="410" stroke="#555" stroke-width="2" marker-end="url(#seta)"/>

  <!-- Decisão 5 -->
  <polygon points="600,410 710,450 600,490 490,450" fill="#eeeeee" stroke="#888"/>
  <text x="600" y="446" font-size="14" text-anchor="middle" fill="#222">Escola aprova</text>
  <text x="600" y="464" font-size="14" text-anchor="middle" fill="#222">o motorista?</text>

  <line x1="490" y1="450" x2="410" y2="450" stroke="#555" stroke-width="2" marker-end="url(#seta)"/>
  <text x="450" y="442" font-size="13" text-anchor="middle" fill="#555">Não</text>
  <rect x="110" y="422" width="300" height="56" rx="8" fill="#cfe8ff" stroke="#6a9fd4"/>
  <text x="260" y="445" font-size="14" text-anchor="middle" fill="#222">Recusa: motorista não fica</text>
  <text x="260" y="465" font-size="14" text-anchor="middle" fill="#222">visível para responsáveis</text>

  <line x1="600" y1="490" x2="600" y2="530" stroke="#555" stroke-width="2" marker-end="url(#seta)"/>
  <text x="615" y="515" font-size="13" fill="#555">Sim</text>
  <rect x="440" y="530" width="320" height="56" rx="8" fill="#d4f5d4" stroke="#5aa85a"/>
  <text x="600" y="553" font-size="15" text-anchor="middle" fill="#222">5a. Motorista fica visível</text>
  <text x="600" y="573" font-size="13" text-anchor="middle" fill="#444">para o responsável da escola</text>
  <line x1="600" y1="586" x2="600" y2="620" stroke="#555" stroke-width="2" marker-end="url(#seta)"/>

  <rect x="440" y="620" width="320" height="56" rx="8" fill="#ffe3c2" stroke="#d9913a"/>
  <text x="600" y="643" font-size="15" text-anchor="middle" fill="#222">6. Responsável se cadastra</text>
  <text x="600" y="663" font-size="13" text-anchor="middle" fill="#444">no app</text>
  <line x1="600" y1="676" x2="600" y2="710" stroke="#555" stroke-width="2" marker-end="url(#seta)"/>

  <rect x="400" y="710" width="400" height="56" rx="8" fill="#ffe3c2" stroke="#d9913a"/>
  <text x="600" y="733" font-size="15" text-anchor="middle" fill="#222">7. Responsável cadastra dependentes</text>
  <text x="600" y="753" font-size="13" text-anchor="middle" fill="#444">e a escola de cada um</text>
  <line x1="600" y1="766" x2="600" y2="790" stroke="#555" stroke-width="2" marker-end="url(#seta)"/>

  <!-- Decisão: quem inicia -->
  <polygon points="600,790 720,830 600,870 480,830" fill="#eeeeee" stroke="#888"/>
  <text x="600" y="826" font-size="14" text-anchor="middle" fill="#222">Quem inicia</text>
  <text x="600" y="844" font-size="14" text-anchor="middle" fill="#222">o contato?</text>

  <!-- Ramo a: responsável procura motorista -->
  <polyline points="480,830 300,830 300,880" fill="none" stroke="#555" stroke-width="2" marker-end="url(#seta)"/>
  <text x="390" y="820" font-size="13" text-anchor="middle" fill="#555">a) Responsável procura</text>

  <rect x="130" y="880" width="340" height="80" rx="8" fill="#ffe3c2" stroke="#d9913a"/>
  <text x="300" y="905" font-size="15" text-anchor="middle" fill="#222">8a. Responsável busca motorista</text>
  <text x="300" y="925" font-size="13" text-anchor="middle" fill="#444">avalia avaliações de outros responsáveis</text>
  <text x="300" y="943" font-size="13" text-anchor="middle" fill="#444">e documentos limitados do motorista</text>
  <line x1="300" y1="960" x2="300" y2="990" stroke="#555" stroke-width="2" marker-end="url(#seta)"/>

  <rect x="130" y="990" width="340" height="80" rx="8" fill="#ffe3c2" stroke="#d9913a"/>
  <text x="300" y="1015" font-size="15" text-anchor="middle" fill="#222">9a. Envia solicitação ao motorista</text>
  <text x="300" y="1035" font-size="13" text-anchor="middle" fill="#444">confirma que, se aceita, os dados</text>
  <text x="300" y="1053" font-size="13" text-anchor="middle" fill="#444">dos dependentes serão compartilhados</text>
  <line x1="300" y1="1070" x2="300" y2="1100" stroke="#555" stroke-width="2" marker-end="url(#seta)"/>

  <rect x="130" y="1100" width="340" height="80" rx="8" fill="#d4f5d4" stroke="#5aa85a"/>
  <text x="300" y="1125" font-size="15" text-anchor="middle" fill="#222">10a. Motorista analisa e decide</text>
  <text x="300" y="1145" font-size="13" text-anchor="middle" fill="#444">Sim: recebe dados e acordo é fechado</text>
  <text x="300" y="1163" font-size="13" text-anchor="middle" fill="#444">Não: recusa é enviada ao responsável</text>

  <!-- Ramo b: motorista procura responsável -->
  <polyline points="720,830 900,830 900,880" fill="none" stroke="#555" stroke-width="2" marker-end="url(#seta)"/>
  <text x="810" y="820" font-size="13" text-anchor="middle" fill="#555">b) Motorista procura</text>

  <rect x="730" y="880" width="340" height="80" rx="8" fill="#d4f5d4" stroke="#5aa85a"/>
  <text x="900" y="905" font-size="15" text-anchor="middle" fill="#222">8b. Motorista busca dependentes</text>
  <text x="900" y="925" font-size="13" text-anchor="middle" fill="#444">das escolas que atende (dados</text>
  <text x="900" y="943" font-size="13" text-anchor="middle" fill="#444">anonimizados, só dados do responsável)</text>
  <line x1="900" y1="960" x2="900" y2="990" stroke="#555" stroke-width="2" marker-end="url(#seta)"/>

  <rect x="730" y="990" width="340" height="80" rx="8" fill="#d4f5d4" stroke="#5aa85a"/>
  <text x="900" y="1015" font-size="15" text-anchor="middle" fill="#222">9b. Envia solicitação ao responsável</text>
  <text x="900" y="1035" font-size="13" text-anchor="middle" fill="#444">do dependente que pretende</text>
  <text x="900" y="1053" font-size="13" text-anchor="middle" fill="#444">transportar</text>
  <line x1="900" y1="1070" x2="900" y2="1100" stroke="#555" stroke-width="2" marker-end="url(#seta)"/>

  <rect x="730" y="1100" width="340" height="80" rx="8" fill="#ffe3c2" stroke="#d9913a"/>
  <text x="900" y="1125" font-size="15" text-anchor="middle" fill="#222">10b. Responsável analisa e decide</text>
  <text x="900" y="1145" font-size="13" text-anchor="middle" fill="#444">Sim: compartilha dados e acordo é fechado</text>
  <text x="900" y="1163" font-size="13" text-anchor="middle" fill="#444">Não: recusa é enviada ao motorista</text>

  <!-- Convergência: acordo -->
  <polyline points="300,1180 300,1210 600,1210" fill="none" stroke="#555" stroke-width="2"/>
  <polyline points="900,1180 900,1210 600,1210" fill="none" stroke="#555" stroke-width="2"/>
  <line x1="600" y1="1210" x2="600" y2="1230" stroke="#555" stroke-width="2" marker-end="url(#seta)"/>

  <rect x="430" y="1230" width="340" height="56" rx="8" fill="#eeeeee" stroke="#888"/>
  <text x="600" y="1253" font-size="15" text-anchor="middle" fill="#222">Acordo de transporte firmado</text>
  <text x="600" y="1273" font-size="13" text-anchor="middle" fill="#444">um por dependente aceito</text>

  <!-- Regras gerais -->
  <rect x="130" y="1310" width="940" height="66" rx="8" fill="#fafafa" stroke="#bbb" stroke-dasharray="4 3"/>
  <text x="150" y="1334" font-size="13" fill="#333">Regras: solicitações expiram em 3 dias · revogação do consentimento encerra o acordo correspondente</text>
  <text x="150" y="1356" font-size="13" fill="#333">Motorista não vê dados completos do dependente antes do aceite · motorista passa por verificação de identidade e antecedentes</text>
</svg>
